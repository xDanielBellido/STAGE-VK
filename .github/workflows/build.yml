name: STAGE VK CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.configuration }} x64
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      - name: Build ${{ matrix.configuration }} x64
        run: msbuild "STAGE_VK/STAGE_VK.sln" /m /p:Configuration=${{ matrix.configuration }} /p:Platform=x64