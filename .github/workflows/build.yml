name: STAGE VK CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.configuration }} x64
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Check Vulkan SDK layout
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK = $env:VULKAN_SDK"
          Get-ChildItem "$env:VULKAN_SDK"

      - name: Inspect Vulkan SDK
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"
          Write-Host "VULKAN_SDK_VERSION=$env:VULKAN_SDK_VERSION"
          Write-Host "Root contents:"
          Get-ChildItem "$env:VULKAN_SDK" -Force
          Write-Host "Searching vulkan.h:"
          Get-ChildItem "$env:VULKAN_SDK" -Recurse -Filter vulkan.h | Select-Object -First 10 FullName
          Write-Host "Searching vulkan-1.lib:"
          Get-ChildItem "$env:VULKAN_SDK" -Recurse -Filter vulkan-1.lib | Select-Object -First 10 FullName

      - name: Build ${{ matrix.configuration }} x64
        run: msbuild "STAGE_VK/STAGE_VK.sln" /m /p:Configuration=${{ matrix.configuration }} /p:Platform=x64